# render.yaml — Render Blueprint for GroupLedger.
#
# Deploys one service (doc/architecture.md §2a "Interim Hosting Plan"):
#
#   groupledger (type: web) — the actual bot process (Baileys socket +
#   Express /keepalive, /health). Render's free web services spin down
#   after ~15 minutes with no inbound HTTP traffic.
#
# Keeping it awake: Render's Cron Job service type is NOT available on
# the free plan (confirmed against the dashboard — "free not a valid
# plan for service type cron"; cron jobs are billed per-second with a
# $1/month minimum on Render). So the keepalive ping has to come from
# outside Render — use a free external scheduler (e.g. cron-job.org,
# UptimeRobot, or GitHub Actions on a schedule) hitting this service's
# public /keepalive endpoint every ~10 minutes. See README.md "Deploying
# to Render" for exact setup steps. /keepalive tracks pingCount/
# lastPingAt in its response so you can confirm the external ping is
# actually landing.
#
# Deploy: push this repo to a Git provider, then in the Render dashboard
# choose "New +" -> "Blueprint" and point it at the repo. Render will
# detect this file and provision the service. Secret env vars (marked
# `sync: false` below) are prompted for during that first setup — fill
# them in from your own .env (see .env.example for what each one means).

services:
  - type: web
    name: groupledger
    runtime: node
    plan: free
    region: oregon
    # npm ci (not npm install) — installs exactly what's in
    # package-lock.json and fails loudly on any lockfile/package.json
    # mismatch, instead of silently resolving fresh transitive versions
    # on every deploy.
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /keepalive
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: WHATSAPP_GROUP_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: BOT_ADMIN_FALLBACK_NUMBER
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OFFLINE_ALERT_THRESHOLD_MINUTES
        value: 10
      # --- v1.1: LLM normalization layer ---
      # Set NORMALIZER_MODE to 'off' here (or omit the sync:false ones
      # below) if you don't want LLM-based message cleanup in production.
      - key: NORMALIZER_MODE
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_FALLBACK_MODEL
        sync: false
      - key: QUEUE_ENABLED
        value: false
      - key: STATE_STORE
        value: file
